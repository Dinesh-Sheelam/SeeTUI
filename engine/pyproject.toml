[project]
name = "SeeTUI"
version = "0.1.0"
description = "SSH Finder UI — a local Finder-style SSH file browser"
requires-python = ">=3.13"
dependencies = [
    "asyncssh>=2.24.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
packaging = [
    "pyinstaller>=6.14.0",
    "pywebview>=5.4",
    "dmgbuild>=1.6.5; sys_platform == 'darwin'",
]

[project.scripts]
seetui = "app.launcher:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
