[project]
name = "SeeTUI"
version = "0.1.0"
description = "SSH Finder UI — a local Finder-style SSH file browser"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncssh>=2.24.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
